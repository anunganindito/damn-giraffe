<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aplikasi Kuis Pembelajaran SMA</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.95);
            --text-light: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
            touch-action: manipulation;
            user-select: none;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .header-brand {
            text-align: center;
            margin-bottom: 15px;
        }

        .watermark {
            display: inline-block;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            margin-bottom: 6px;
        }

        .motto {
            font-style: italic;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .title {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 15px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
            max-height: 280px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .cat-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 10px 5px;
            color: white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .cat-btn i { font-size: 1.4rem; color: #38bdf8; }

        .cat-btn.selected {
            background: rgba(99, 102, 241, 0.3);
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(79, 70, 229, 0.4);
        }

        .btn-action {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-start {
            flex: 2;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-info {
            flex: 1;
            padding: 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .question-box {
            font-size: 1.1rem;
            margin-bottom: 20px;
            line-height: 1.5;
            text-align: center;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.25);
            padding: 15px;
            border-radius: 14px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .opt-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 15px;
            border-radius: 12px;
            color: white;
            font-size: 0.95rem;
            cursor: pointer;
            text-align: left;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .reaction-emoji { font-size: 4.5rem; margin-bottom: 10px; }
        .reaction-text { font-size: 1.3rem; font-weight: bold; margin-bottom: 15px; text-align: center; }

        .hidden { display: none !important; }

        @media (min-width: 600px) {
            .options-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-brand">
            <div class="watermark"><i class="fa-solid fa-graduation-cap"></i> Anung anindito.sman1cijeruk</div>
            <div class="motto">"belajar untuk hidup, hidup untuk belajar"</div>
        </div>

        <div id="menuScreen" class="card">
            <h1 class="title">Kuis Pembelajaran SMA</h1>
            
            <p style="text-align: center; margin-bottom: 10px; color: #cbd5e1; font-size:0.9rem;">Pilih Mata Pelajaran:</p>
            
            <div class="category-grid" id="categoryGrid">
                <div class="cat-btn selected" data-cat="informatika"><i class="fa-solid fa-laptop-code"></i><span>Informatika</span></div>
                <div class="cat-btn" data-cat="biologi"><i class="fa-solid fa-dna"></i><span>Biologi</span></div>
                <div class="cat-btn" data-cat="kimia"><i class="fa-solid fa-flask"></i><span>Kimia</span></div>
                <div class="cat-btn" data-cat="fisika"><i class="fa-solid fa-atom"></i><span>Fisika</span></div>
                <div class="cat-btn" data-cat="matematika"><i class="fa-solid fa-calculator"></i><span>Matematika</span></div>
                <div class="cat-btn" data-cat="ekonomi"><i class="fa-solid fa-chart-line"></i><span>Ekonomi</span></div>
                <div class="cat-btn" data-cat="geografi"><i class="fa-solid fa-earth-americas"></i><span>Geografi</span></div>
                <div class="cat-btn" data-cat="indo"><i class="fa-solid fa-book"></i><span>B. Indonesia</span></div>
            </div>

            <div class="btn-action">
                <button class="btn-start" id="btnStartGame">Mulai Belajar <i class="fa-solid fa-play"></i></button>
            </div>
        </div>

        <div id="quizScreen" class="card hidden">
            <div class="quiz-header">
                <button id="btnBack" style="background:none; border:none; color:white; cursor:pointer; font-size:0.9rem;">
                    <i class="fa-solid fa-arrow-left"></i> Menu Utama
                </button>
                <div class="badge" id="scoreBadge">Skor: 0</div>
                <div class="badge" id="questionNumBadge">Soal 1/5</div>
            </div>

            <div class="question-box" id="questionText">
                Pertanyaan...
            </div>

            <div class="options-grid" id="pgOptions"></div>
        </div>
    </div>

    <div class="modal-overlay" id="reactionOverlay">
        <div class="reaction-emoji" id="reactionEmoji">😊</div>
        <div class="reaction-text" id="reactionText">Jawaban Benar!</div>
        <button class="btn-start" id="btnNextLevel" style="max-width: 220px;">Lanjut <i class="fa-solid fa-arrow-right"></i></button>
    </div>

    <script>
    // Memastikan DOM siap sepenuhnya sebelum JS berjalan (Mencegah Stuck)
    document.addEventListener("DOMContentLoaded", function() {
        
        // Safe LocalStorage Handler (Anti Crash)
        function safeSetStorage(key, val) {
            try { localStorage.setItem(key, val); } catch(e) {}
        }
        function safeGetStorage(key) {
            try { return localStorage.getItem(key); } catch(e) { return null; }
        }

        const questionsData = {
            informatika: [
                { q: "Struktur data LIFO (Last In First Out) adalah?", opts: ["Stack", "Queue", "Array", "Tree"], a: "Stack" },
                { q: "Simbol belah ketupat pada flowchart menunjukkan?", opts: ["Keputusan", "Input/Output", "Proses", "Start"], a: "Keputusan" },
                { q: "Bahasa pemrograman yang sering digunakan untuk AI & Data Science?", opts: ["Python", "HTML", "CSS", "Pascal"], a: "Python" },
                { q: "Komponen fisik komputer disebut?", opts: ["Hardware", "Software", "Brainware", "Firmware"], a: "Hardware" },
                { q: "Satu byte terdiri dari berapa bit?", opts: ["8", "16", "32", "64"], a: "8" }
            ],
            biologi: [
                { q: "Organel sel penghasil energi ATP adalah?", opts: ["Mitokondria", "Ribosom", "Lisosom", "Kloroplas"], a: "Mitokondria" },
                { q: "Proses pembuatan makanan pada tumbuhan hijau disebut?", opts: ["Fotosintesis", "Respirasi", "Transpirasi", "Osmosis"], a: "Fotosintesis" },
                { q: "Pembelahan sel yang menghasilkan sel anakan identik adalah?", opts: ["Mitosis", "Meiosis", "Amitosis", "Amitotik"], a: "Mitosis" },
                { q: "Zat hijau daun disebut?", opts: ["Klorofil", "Karoten", "Xantofil", "Melanin"], a: "Klorofil" },
                { q: "Penyusun utama dinding sel tumbuhan adalah?", opts: ["Selulosa", "Kitin", "Peptidoglikan", "Lignin"], a: "Selulosa" }
            ]
        };

        let currentCat = 'informatika';
        let currentQIndex = 0;
        let score = 0;

        // Universal Event Listener (Bisa Klik & Sentuh Layar HP)
        function addTouchClick(elem, fn) {
            if (!elem) return;
            let handled = false;
            elem.addEventListener("touchstart", function(e) {
                handled = true;
                fn.call(this, e);
            }, {passive: true});
            elem.addEventListener("click", function(e) {
                if (!handled) fn.call(this, e);
                handled = false;
            });
        }

        // Pilihan Kategori
        document.querySelectorAll('.cat-btn').forEach(btn => {
            addTouchClick(btn, function() {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
                currentCat = this.dataset.cat;
            });
        });

        const menuScreen = document.getElementById('menuScreen');
        const quizScreen = document.getElementById('quizScreen');

        addTouchClick(document.getElementById('btnStartGame'), function() {
            menuScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            currentQIndex = 0;
            score = 0;
            loadQuestion();
        });

        addTouchClick(document.getElementById('btnBack'), function() {
            quizScreen.classList.add('hidden');
            menuScreen.classList.remove('hidden');
        });

        function loadQuestion() {
            const list = questionsData[currentCat] || questionsData['informatika'];
            const qObj = list[currentQIndex];

            document.getElementById('questionNumBadge').innerText = `Soal ${currentQIndex + 1}/${list.length}`;
            document.getElementById('scoreBadge').innerText = `Skor: ${score}`;
            document.getElementById('questionText').innerText = qObj.q;

            const optsGrid = document.getElementById('pgOptions');
            optsGrid.innerHTML = '';

            qObj.opts.forEach(opt => {
                const b = document.createElement('button');
                b.className = 'opt-btn';
                b.innerText = opt;
                addTouchClick(b, function() {
                    checkAnswer(opt, qObj.a);
                });
                optsGrid.appendChild(b);
            });
        }

        function checkAnswer(userOpt, correctOpt) {
            const isCorrect = userOpt === correctOpt;
            if (isCorrect) score += 20;

            const overlay = document.getElementById('reactionOverlay');
            document.getElementById('reactionEmoji').innerText = isCorrect ? '😊' : '😢';
            document.getElementById('reactionText').innerText = isCorrect ? 'Jawaban Benar! 🎉' : `Salah! Jawaban: ${correctOpt}`;
            document.getElementById('reactionText').style.color = isCorrect ? '#10b981' : '#ef4444';
            
            overlay.classList.add('active');
        }

        addTouchClick(document.getElementById('btnNextLevel'), function() {
            document.getElementById('reactionOverlay').classList.remove('active');
            const list = questionsData[currentCat] || questionsData['informatika'];
            currentQIndex++;
            
            if (currentQIndex < list.length) {
                loadQuestion();
            } else {
                alert(`Kuis Selesai! Total Skor Anda: ${score}`);
                quizScreen.classList.add('hidden');
                menuScreen.classList.remove('hidden');
            }
        });
    });
    </script>
</body>
    </html>
