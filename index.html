<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Belajar Interaktif - Anung Anindito</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.88);
            --text-light: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Canvas Latar Belakang Dinamis */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 950px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Header Watermark & Motto */
        .header-brand {
            text-align: center;
            margin-bottom: 20px;
            animation: fadeInDown 0.8s ease;
        }

        .watermark {
            display: inline-block;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            margin-bottom: 8px;
        }

        .motto {
            font-style: italic;
            color: #94a3b8;
            font-size: 1.1rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Kartu Tampilan Main UI */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.8s ease;
        }

        .title {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 20px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Grid Pilihan Pelajaran */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .cat-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 14px 8px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .cat-btn i {
            font-size: 1.8rem;
            color: #38bdf8;
        }

        .cat-btn:hover, .cat-btn.selected {
            background: rgba(99, 102, 241, 0.25);
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: 0 8px 18px rgba(79, 70, 229, 0.3);
        }

        /* Mode Selector */
        .mode-section {
            margin-top: 15px;
            text-align: center;
        }

        .mode-options {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 12px 0;
        }

        .mode-btn {
            flex: 1;
            max-width: 200px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .mode-btn.selected {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(79, 70, 229, 0.5);
        }

        /* Button Action */
        .btn-action {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-start {
            flex: 2;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.4);
        }

        .btn-info {
            flex: 1;
            padding: 15px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-start:hover, .btn-info:hover {
            transform: scale(1.02);
        }

        /* HUD Kuis */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
        }

        .lives {
            color: var(--danger);
            font-size: 1.2rem;
        }

        .question-box {
            font-size: 1.3rem;
            margin-bottom: 25px;
            line-height: 1.6;
            text-align: center;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Pilihan Ganda & Uraian */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .opt-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
        }

        .opt-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .essay-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .essay-input {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-size: 1.1rem;
            outline: none;
        }

        .essay-input:focus {
            border-color: var(--primary);
        }

        /* Overlay Animasi Reaksi & Info Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .reaction-emoji {
            font-size: 7rem;
            margin-bottom: 15px;
            animation: bounce 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .reaction-text {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        .info-card {
            background: #1e293b;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 25px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            color: #cbd5e1;
            line-height: 1.6;
        }

        .info-card h2 {
            color: #38bdf8;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }

        .info-card h3 {
            color: white;
            margin: 14px 0 6px;
        }

        .info-card ul {
            margin-left: 20px;
            margin-bottom: 10px;
        }

        .hidden { display: none !important; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
            .title { font-size: 1.6rem; }
            .category-grid { grid-template-columns: repeat(2, 1fr); }
            .btn-action { flex-direction: column; }
        }
    </style>
</head>
