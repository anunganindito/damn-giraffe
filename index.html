<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aplikasi Kuis Pembelajaran SMA - Anung Anindito</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* ========================================================= */
        /* 1. VARIABEL & TEMA CSS DINAMIS (KUNCI PERUBAHAN TEMA)      */
        /* ========================================================= */
        :root {
            /* Tema Default (Informatika) */
            --bg-color-1: #0f172a; /* Biru Sangat Tua */
            --bg-color-2: #1e293b; /* Biru Tua */
            --primary-color: #38bdf8; /* Biru Cerah */
            --primary-hover: #0ea5e9;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --text-light: #f8fafc;
            --card-bg: rgba(30, 41, 59, 0.95);
            --danger: #ef4444;
            --success: #10b981;
        }

        /* Definisi Tema Warna per Mata Pelajaran */
        body.theme-fisika {
            --bg-color-1: #1a1a1a; --bg-color-2: #333333; /* Abu-abu Atom */
            --primary-color: #ff3e3e; --accent-glow: rgba(255, 62, 62, 0.3); /* Merah Energi */
        }
        body.theme-biologi {
            --bg-color-1: #052e16; --bg-color-2: #14532d; /* Hijau Hutan Tua */
            --primary-color: #4ade80; --accent-glow: rgba(74, 222, 128, 0.3); /* Hijau Daun */
        }
        body.theme-kimia {
            --bg-color-1: #2e1065; --bg-color-2: #4c1d95; /* Ungu Reaksi Tua */
            --primary-color: #a78bfa; --accent-glow: rgba(167, 139, 250, 0.3); /* Ungu Muda */
        }
        body.theme-matematika {
            --bg-color-1: #450a0a; --bg-color-2: #7f1d1d; /* Merah Marun Tua */
            --primary-color: #fb923c; --accent-glow: rgba(251, 146, 60, 0.3); /* Oranye Logika */
        }
        body.theme-sejarah {
            --bg-color-1: #422006; --bg-color-2: #713f12; /* Cokelat Dokumen Tua */
            --primary-color: #e9c46a; --accent-glow: rgba(233, 196, 106, 0.3); /* Emas Kuno */
        }
        body.theme-geografi {
            --bg-color-1: #0c4a6e; --bg-color-2: #075985; /* Biru Samudra Tua */
            --primary-color: #22d3ee; --accent-glow: rgba(34, 211, 238, 0.3); /* Biru Langit */
        }
        body.theme-ekonomi {
            --bg-color-1: #14532d; --bg-color-2: #166534; /* Hijau Uang Tua */
            --primary-color: #fbbf24; --accent-glow: rgba(251, 191, 36, 0.3); /* Kuning Emas */
        }
        body.theme-sosiologi {
            --bg-color-1: #701a75; --bg-color-2: #86198f; /* Magenta Masyarakat Tua */
            --primary-color: #f472b6; --accent-glow: rgba(244, 114, 182, 0.3); /* Pink */
        }
        body.theme-indo, body.theme-sunda, body.theme-jawa {
            --bg-color-1: #78350f; --bg-color-2: #92400e; /* Cokelat Batik Tua */
            --primary-color: #a16207; --accent-glow: rgba(161, 98, 7, 0.3); /* Cokelat Muda */
        }
        body.theme-inggris, body.theme-jepang, body.theme-china, body.theme-jerman {
            --bg-color-1: #1e1b4b; --bg-color-2: #312e81; /* Biru Global Tua */
            --primary-color: #818cf8; --accent-glow: rgba(129, 140, 248, 0.3); /* Biru Indigo */
        }

        /* ========================================================= */
        /* 2. CSS DASAR & RESET                                      */
        /* ========================================================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color-1);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            touch-action: manipulation;
            user-select: none;
            transition: background-color 0.8s ease;
        }

        /* 3. Canvas Latar Belakang Animasi Edukatif */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* Di belakang konten */
            pointer-events: none; /* Sentuhan tembus ke tombol */
        }

        .container {
            position: relative;
            z-index: 2; /* Di depan canvas */
            max-width: 850px;
            margin: 0 auto;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Header Watermark */
        .header-brand {
            text-align: center;
            margin-bottom: 15px;
        }

        .watermark {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary-color), #a855f7);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px var(--accent-glow);
            margin-bottom: 6px;
            transition: all 0.5s ease;
        }

        .motto {
            font-style: italic;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        /* Kartu Utama */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            transition: background 0.5s ease, border 0.5s ease;
        }

        .title {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 15px;
            background: linear-gradient(to right, var(--primary-color), var(--text-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: all 0.5s ease;
        }

        /* Grid Pilihan Pelajaran */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(105px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
            max-height: 280px;
            overflow-y: auto;
            padding-right: 5px;
        }

        /* Scrollbar styling */
        .category-grid::-webkit-scrollbar { width: 5px; }
        .category-grid::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
        .category-grid::-webkit-scrollbar-thumb { background: var(--primary-color); border-radius: 5px; }

        .cat-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 10px 5px;
            color: white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            outline: none;
            transition: all 0.3s ease;
        }

        .cat-btn i {
            font-size: 1.4rem;
            color: var(--primary-color);
            transition: color 0.5s ease;
        }

        .cat-btn.selected {
            background: var(--accent-glow);
            border-color: var(--primary-color);
            box-shadow: 0 0 12px var(--accent-glow);
            transform: translateY(-2px);
        }

        /* Mode Selector */
        .mode-section {
            margin-top: 10px;
            text-align: center;
        }

        .mode-options {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 10px 0;
        }

        .mode-btn {
            flex: 1;
            max-width: 180px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            outline: none;
            transition: all 0.3s ease;
        }

        .mode-btn.selected {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: var(--bg-color-1);
        }

        .btn-action {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-start {
            flex: 2;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            color: var(--bg-color-1);
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
        }

        .btn-start:active { transform: scale(0.97); }

        .btn-info {
            flex: 1;
            padding: 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
